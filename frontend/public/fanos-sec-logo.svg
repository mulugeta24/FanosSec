<svg width="180" height="50" viewBox="0 0 180 50" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Shield background -->
  <path d="M20 5L25 3L30 5V15C30 22 27 28 20 32C13 28 10 22 10 15V5L15 3L20 5Z" fill="url(#shieldGradient)" stroke="#3B82F6" stroke-width="1.5"/>
  
  <!-- Letter F inside shield -->
  <path d="M18 12H24V14H20V18H23V20H20V25H18V12Z" fill="white" font-weight="bold"/>
  
  <!-- Pixel effects around shield -->
  <rect x="8" y="8" width="2" height="2" fill="#60A5FA" opacity="0.6"/>
  <rect x="32" y="10" width="2" height="2" fill="#3B82F6" opacity="0.8"/>
  <rect x="7" y="20" width="2" height="2" fill="#2563EB" opacity="0.7"/>
  <rect x="33" y="22" width="2" height="2" fill="#60A5FA" opacity="0.5"/>
  <rect x="15" y="34" width="2" height="2" fill="#3B82F6" opacity="0.6"/>
  <rect x="23" y="34" width="2" height="2" fill="#2563EB" opacity="0.7"/>
  
  <!-- FANOS SEC text -->
  <text x="40" y="22" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="url(#textGradient)">FANOS</text>
  <text x="40" y="36" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#64748B" letter-spacing="2">SEC</text>
  
  <!-- Small pixel decorations near text -->
  <rect x="90" y="14" width="1.5" height="1.5" fill="#3B82F6" opacity="0.4"/>
  <rect x="93" y="17" width="1.5" height="1.5" fill="#60A5FA" opacity="0.5"/>
  <rect x="88" y="30" width="1.5" height="1.5" fill="#2563EB" opacity="0.6"/>
  
  <!-- Gradients -->
  <defs>
    <linearGradient id="shieldGradient" x1="20" y1="3" x2="20" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="textGradient" x1="40" y1="12" x2="80" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
</svg>
